<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ছায়াছবি</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#0b0b0f;
  color:white;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

.box{
  width:90%;
  max-width:420px;
  background:#15151c;
  padding:30px 20px;
  border-radius:22px;
  text-align:center;
  box-shadow:0 10px 40px #000;
}

h1{
  margin-bottom:10px;
}

p{
  color:#aaa;
  margin-bottom:25px;
}

button{
  width:100%;
  padding:15px;
  margin-top:12px;
  border:0;
  border-radius:12px;
  background:#ff3b6b;
  color:white;
  font-size:16px;
  font-weight:bold;
}

input{
  width:100%;
  padding:15px;
  margin-top:15px;
  border:none;
  border-radius:12px;
  background:#252530;
  color:white;
  text-align:center;
  font-size:18px;
}
</style>
</head>

<body>

<div class="box">

  <h1>❤️ ছায়াছবি</h1>
  <p>দুজনের জন্য একটি ব্যক্তিগত Room তৈরি করুন</p>

  <button onclick="createRoom()">
    নতুন Room তৈরি করুন
  </button>

  <input
    id="roomCode"
    placeholder="Room Code লিখুন"
    maxlength="10"
  >

  <button onclick="joinRoom()">
    Room-এ প্রবেশ করুন
  </button>

</div>

<script>

function createRoom(){

  const code =
    Math.random().toString(36)
    .substring(2,8)
    .toUpperCase();

  document.getElementById("roomCode").value = code;

  alert("আপনার Room Code: " + code);
}

function joinRoom(){

  const code =
    document.getElementById("roomCode").value.trim();

  if(!code){
    alert("আগে Room Code লিখুন");
    return;
  }

  alert("Room " + code + " এ প্রবেশের প্রস্তুতি সম্পন্ন!");
}

</script>

</body>
</html>
