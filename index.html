<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#0b0b12">
<title>দুজন ❤️</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#08080d,#21101c);
  color:white;
  min-height:100vh;
}

.container{
  width:100%;
  max-width:420px;
  margin:auto;
  padding:25px 20px;
}

.page{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

.card{
  width:100%;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.12);
  border-radius:25px;
  padding:28px 22px;
  backdrop-filter:blur(15px);
  box-shadow:0 20px 50px rgba(0,0,0,.4);
}

.logo{
  text-align:center;
  font-size:42px;
  margin-bottom:8px;
}

h1{
  text-align:center;
  font-size:30px;
  margin-bottom:8px;
}

.subtitle{
  text-align:center;
  color:#cfcfcf;
  margin-bottom:25px;
}

input{
  width:100%;
  padding:15px;
  margin:8px 0;
  border:none;
  outline:none;
  border-radius:14px;
  background:rgba(255,255,255,.1);
  color:white;
  font-size:16px;
}

input::placeholder{
  color:#aaa;
}

button{
  width:100%;
  padding:15px;
  margin-top:12px;
  border:none;
  border-radius:14px;
  background:linear-gradient(135deg,#ff416c,#ff4b2b);
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

button.secondary{
  background:rgba(255,255,255,.1);
}

.link{
  text-align:center;
  margin-top:18px;
  color:#ff7190;
  cursor:pointer;
}

.hidden{
  display:none !important;
}

.home{
  padding-top:50px;
  padding-bottom:30px;
}

.welcome{
  text-align:center;
  margin-bottom:30px;
}

.welcome h2{
  font-size:28px;
  margin-bottom:8px;
}

.user{
  color:#bbb;
  font-size:14px;
  word-break:break-all;
}

.features{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.feature{
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.1);
  border-radius:20px;
  padding:25px 10px;
  text-align:center;
  cursor:pointer;
}

.feature .icon{
  font-size:35px;
  margin-bottom:10px;
}

.feature p{
  font-size:14px;
}

.logout{
  margin-top:25px;
  background:#333;
}
</style>
</head>

<body>

<!-- LOGIN / REGISTER -->
<div id="authPage" class="page">
  <div class="container">
    <div class="card">

      <div class="logo">❤️</div>

      <h1 id="authTitle">দুজন</h1>

      <p class="subtitle" id="authSubtitle">
        দুজন মানুষের জন্য একটি ছোট্ট জায়গা
      </p>

      <!-- LOGIN FORM -->
      <div id="loginForm">

        <input
          type="email"
          id="loginEmail"
          placeholder="ই-মেইল"
        >

        <input
          type="password"
          id="loginPassword"
          placeholder="পাসওয়ার্ড"
        >

        <button onclick="login()">
          লগইন ❤️
        </button>

        <div class="link" onclick="showRegister()">
          নতুন অ্যাকাউন্ট তৈরি করো
        </div>

      </div>


      <!-- REGISTER FORM -->
      <div id="registerForm" class="hidden">

        <input
          type="email"
          id="registerEmail"
          placeholder="ই-মেইল"
        >

        <input
          type="password"
          id="registerPassword"
          placeholder="পাসওয়ার্ড"
        >

        <input
          type="password"
          id="confirmPassword"
          placeholder="পাসওয়ার্ড আবার লিখো"
        >

        <button onclick="register()">
          অ্যাকাউন্ট তৈরি ❤️
        </button>

        <div class="link" onclick="showLogin()">
          আগে থেকেই অ্যাকাউন্ট আছে? লগইন করো
        </div>

      </div>

    </div>
  </div>
</div>


<!-- HOME PAGE -->
<div id="homePage" class="hidden">

  <div class="container home">

    <div class="welcome">

      <div class="logo">💞</div>

      <h2>স্বাগতম দুজনে</h2>

      <p class="user" id="userEmail"></p>

    </div>


    <div class="features">

      <div class="feature" onclick="comingSoon('চ্যাট')">
        <div class="icon">💬</div>
        <p>চ্যাট</p>
      </div>

      <div class="feature" onclick="comingSoon('ভিডিও কল')">
        <div class="icon">📹</div>
        <p>ভিডিও কল</p>
      </div>

      <div class="feature" onclick="comingSoon('অডিও কল')">
        <div class="icon">📞</div>
        <p>অডিও কল</p>
      </div>

      <div class="feature" onclick="comingSoon('প্রাইভেট রুম')">
        <div class="icon">🔐</div>
        <p>প্রাইভেট রুম</p>
      </div>

    </div>

    <button class="logout" onclick="logout()">
      লগআউট
    </button>

  </div>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


const firebaseConfig = {

  apiKey: "AIzaSyDit5Hug1_T_ajiBqAU31QSZyc_rn8xf2mA",

  authDomain: "dujon-91f07.firebaseapp.com",

  projectId: "dujon-91f07",

  storageBucket: "dujon-91f07.firebasestorage.app",

  messagingSenderId: "214183518155",

  appId: "1:214183518155:web:80ea07b1b16196a44f204e"

};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);


// ======================
// REGISTER
// ======================

window.register = async function(){

  const email =
    document.getElementById("registerEmail").value.trim();

  const password =
    document.getElementById("registerPassword").value;

  const confirmPassword =
    document.getElementById("confirmPassword").value;


  if(!email || !password || !confirmPassword){

    alert("সব ঘর পূরণ করো ❤️");

    return;
  }


  if(password !== confirmPassword){

    alert("দুইটি পাসওয়ার্ড একই নয়।");

    return;
  }


  if(password.length < 6){

    alert("পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে।");

    return;
  }


  try{

    await createUserWithEmailAndPassword(
      auth,
      email,
      password
    );

    alert("অ্যাকাউন্ট তৈরি হয়েছে ❤️");

  }

  catch(error){

    console.error(error);

    if(error.code === "auth/email-already-in-use"){

      alert("এই ই-মেইল দিয়ে আগে থেকেই অ্যাকাউন্ট আছে।");

    }

    else if(error.code === "auth/invalid-email"){

      alert("সঠিক ই-মেইল লিখো।");

    }

    else if(error.code === "auth/weak-password"){

      alert("পাসওয়ার্ড আরও শক্ত করো।");

    }

    else{

      alert("অ্যাকাউন্ট তৈরি করা যায়নি। আবার চেষ্টা করো।");

    }

  }

};


// ======================
// LOGIN
// ======================

window.login = async function(){

  const email =
    document.getElementById("loginEmail").value.trim();

  const password =
    document.getElementById("loginPassword").value;


  if(!email || !password){

    alert("ই-মেইল এবং পাসওয়ার্ড লিখো।");

    return;
  }


  try{

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

    alert("লগইন সফল হয়েছে ❤️");

  }

  catch(error){

    console.error(error);

    if(
      error.code === "auth/invalid-credential" ||
      error.code === "auth/wrong-password" ||
      error.code === "auth/user-not-found"
    ){

      alert("ই-মেইল অথবা পাসওয়ার্ড সঠিক নয়।");

    }

    else{

      alert("লগইন করা যায়নি। আবার চেষ্টা করো।");

    }

  }

};


// ======================
// SHOW REGISTER
// ======================

window.showRegister = function(){

  document
    .getElementById("loginForm")
    .classList.add("hidden");

  document
    .getElementById("registerForm")
    .classList.remove("hidden");

  document
    .getElementById("authTitle")
    .innerText = "নতুন অ্যাকাউন্ট ❤️";

  document
    .getElementById("authSubtitle")
    .innerText = "দুজনের যাত্রা এখান থেকেই শুরু";


};


// ======================
// SHOW LOGIN
// ======================

window.showLogin = function(){

  document
    .getElementById("registerForm")
    .classList.add("hidden");

  document
    .getElementById("loginForm")
    .classList.remove("hidden");

  document
    .getElementById("authTitle")
    .innerText = "দুজন";

  document
    .getElementById("authSubtitle")
    .innerText =
      "দুজন মানুষের জন্য একটি ছোট্ট জায়গা";

};


// ======================
// AUTH STATE
// ======================

onAuthStateChanged(auth,(user)=>{

  if(user){

    document
      .getElementById("authPage")
      .classList.add("hidden");

    document
      .getElementById("homePage")
      .classList.remove("hidden");

    document
      .getElementById("userEmail")
      .innerText = user.email;

  }

  else{

    document
      .getElementById("homePage")
      .classList.add("hidden");

    document
      .getElementById("authPage")
      .classList.remove("hidden");

  }

});


// ======================
// LOGOUT
// ======================

window.logout = async function(){

  await signOut(auth);

};


// ======================
// COMING SOON
// ======================

window.comingSoon = function(feature){

  alert(
    feature +
    " ফিচারটি আমরা পরের ধাপে তৈরি করবো ❤️"
  );

};

</script>

</body>
</html>
