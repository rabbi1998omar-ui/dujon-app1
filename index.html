<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>দুজন ❤️</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#0b0b12;
  color:white;
  min-height:100vh;
}

button{
  border:0;
  border-radius:12px;
  padding:13px 18px;
  font-size:16px;
  cursor:pointer;
}

input{
  width:100%;
  padding:14px;
  margin:8px 0;
  border:0;
  border-radius:12px;
  font-size:16px;
}

.page{
  display:none;
  min-height:100vh;
  padding:25px;
}

.active{
  display:block;
}

.card{
  max-width:450px;
  margin:40px auto;
  background:#171722;
  padding:25px;
  border-radius:22px;
}

h1{
  text-align:center;
  margin-bottom:20px;
}

.main-btn{
  width:100%;
  margin-top:12px;
  background:#ff3b81;
  color:white;
}

.secondary{
  background:#292938;
  color:white;
}

.status{
  text-align:center;
  margin:15px 0;
  color:#8aff9b;
}

.room-code{
  text-align:center;
  font-size:35px;
  letter-spacing:7px;
  margin:25px 0;
  color:#ff5b98;
}

.chat-box{
  height:55vh;
  overflow-y:auto;
  background:#11111a;
  padding:15px;
  border-radius:15px;
}

.message{
  padding:10px 14px;
  margin:8px 0;
  border-radius:15px;
  max-width:80%;
  background:#292938;
}

.me{
  margin-left:auto;
  background:#ff3b81;
}

.chat-input{
  display:flex;
  gap:8px;
  margin-top:10px;
}

.chat-input input{
  margin:0;
}

.chat-input button{
  background:#ff3b81;
  color:white;
}

/* VIDEO */

.video-page{
  padding:10px;
  background:#000;
}

.video-container{
  position:relative;
  width:100%;
  height:70vh;
  background:#111;
  border-radius:15px;
  overflow:hidden;
}

#remoteVideo{
  width:100%;
  height:100%;
  object-fit:cover;
  background:#111;
}

#localVideo{
  position:absolute;
  right:15px;
  top:15px;
  width:130px;
  height:180px;
  object-fit:cover;
  border-radius:12px;
  border:2px solid white;
  background:#222;
}

.video-controls{
  display:flex;
  justify-content:center;
  gap:10px;
  margin-top:15px;
  flex-wrap:wrap;
}

.video-controls button{
  background:#292938;
  color:white;
}

.end{
  background:#e53935 !important;
}

/* INCOMING CALL */

#incomingCall{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.94);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:9999;
}

.call-card{
  width:90%;
  max-width:360px;
  background:#191925;
  border-radius:25px;
  padding:30px;
  text-align:center;
}

.call-icon{
  font-size:65px;
  margin-bottom:15px;
}

.call-card h2{
  margin-bottom:10px;
}

.call-buttons{
  display:flex;
  gap:12px;
  margin-top:25px;
}

.call-buttons button{
  flex:1;
}

.accept{
  background:#19b95b;
  color:white;
}

.reject{
  background:#e53935;
  color:white;
}
</style>
</head>

<body>

<!-- LOGIN -->
<section id="loginPage" class="page active">
  <div class="card">
    <h1>দুজন ❤️</h1>

    <input id="loginPhone" type="tel" placeholder="মোবাইল নাম্বার">
    <input id="loginPin" type="password" placeholder="PIN">

    <button class="main-btn" onclick="login()">লগইন</button>
    <button class="main-btn secondary" onclick="showPage('registerPage')">
      নতুন অ্যাকাউন্ট
    </button>

    <p id="loginMessage" style="text-align:center;margin-top:15px;"></p>
  </div>
</section>


<!-- REGISTER -->
<section id="registerPage" class="page">
  <div class="card">
    <h1>অ্যাকাউন্ট তৈরি ❤️</h1>

    <input id="regPhone" type="tel" placeholder="মোবাইল নাম্বার">
    <input id="regPin" type="password" placeholder="৪-৬ সংখ্যার PIN">

    <button class="main-btn" onclick="registerUser()">অ্যাকাউন্ট তৈরি</button>
    <button class="main-btn secondary" onclick="showPage('loginPage')">
      ফিরে যাও
    </button>

    <p id="regMessage" style="text-align:center;margin-top:15px;"></p>
  </div>
</section>


<!-- HOME -->
<section id="homePage" class="page">
  <div class="card">
    <h1>দুজন ❤️</h1>

    <button class="main-btn" onclick="showPage('roomPage')">
      🔐 Private Room
    </button>

    <button class="main-btn" onclick="openChat()">
      💬 Chat
    </button>

    <button class="main-btn" onclick="startVideoFromHome()">
      🎥 Video Call
    </button>

    <button class="main-btn secondary" onclick="logout()">
      Logout
    </button>
  </div>
</section>


<!-- ROOM -->
<section id="roomPage" class="page">
  <div class="card">
    <h1>Private Room 🔐</h1>

    <button class="main-btn" onclick="createRoom()">
      নতুন Room তৈরি
    </button>

    <div id="roomCodeBox"></div>

    <input id="joinCode" maxlength="6"
           inputmode="numeric"
           placeholder="৬ সংখ্যার Room Code">

    <button class="main-btn" onclick="joinRoom()">
      Room-এ ঢুকুন
    </button>

    <p id="connectionStatus" class="status">
      ⚪ Room Connected নয়
    </p>

    <button class="main-btn secondary" onclick="showPage('homePage')">
      Home
    </button>
  </div>
</section>


<!-- CHAT -->
<section id="chatPage" class="page">
  <div class="card">
    <h1>💬 দুজন Chat</h1>

    <div id="chatBox" class="chat-box"></div>

    <div class="chat-input">
      <input id="messageInput"
             type="text"
             placeholder="মেসেজ লিখুন..."
             onkeydown="if(event.key==='Enter')sendMessage()">

      <button onclick="sendMessage()">Send</button>
    </div>

    <button class="main-btn secondary" onclick="showPage('homePage')">
      Home
    </button>
  </div>
</section>


<!-- VIDEO CALL -->
<section id="videoPage" class="page video-page">

  <div class="video-container">

    <video id="remoteVideo"
           autoplay
           playsinline></video>

    <video id="localVideo"
           autoplay
           muted
           playsinline></video>

  </div>

  <div class="video-controls">

    <button onclick="toggleCamera()">
      📷 Camera
    </button>

    <button onclick="toggleMic()">
      🎤 Mic
    </button>

    <button class="end" onclick="endCall(true)">
      🔴 End
    </button>

  </div>

</section>


<!-- INCOMING CALL -->
<div id="incomingCall">

  <div class="call-card">

    <div class="call-icon">📞</div>

    <h2>Incoming Video Call</h2>

    <p style="margin-top:8px;color:#bbb;">
      আপনার জন্য একটি ভিডিও কল এসেছে
    </p>

    <div class="call-buttons">

      <button class="accept" onclick="acceptCall()">
        গ্রহণ
      </button>

      <button class="reject" onclick="rejectCall()">
        বাতিল
      </button>

    </div>

  </div>

</div>


<script>

/* =====================================
   BASIC APP
===================================== */

const WS_URL =
  "wss://dujon-app1.onrender.com";

let socket = null;
let currentRoom =
  localStorage.getItem("dujon_room") || null;

let pendingOffer = null;


/* =====================================
   WEBRTC
===================================== */

let peerConnection = null;
let localStream = null;

const rtcConfig = {

  iceServers: [

    {
      urls:
        "stun:stun.l.google.com:19302"
    },

    {
      urls:
        "stun:stun1.l.google.com:19302"
    }

  ]

};


/* =====================================
   PAGE
===================================== */

function showPage(id){

  document
    .querySelectorAll(".page")
    .forEach(p =>
      p.classList.remove("active")
    );

  const page =
    document.getElementById(id);

  if(page){
    page.classList.add("active");
  }

}


/* =====================================
   REGISTER
===================================== */

function registerUser(){

  const phone =
    document.getElementById("regPhone").value.trim();

  const pin =
    document.getElementById("regPin").value.trim();

  if(!phone || !pin){

    document.getElementById("regMessage").innerText =
      "সব তথ্য দিন";

    return;
  }

  localStorage.setItem(
    "dujon_user",
    JSON.stringify({
      phone,
      pin
    })
  );

  document.getElementById("regMessage").innerText =
    "অ্যাকাউন্ট তৈরি হয়েছে ❤️";

  setTimeout(() => {
    showPage("loginPage");
  },800);

}


/* =====================================
   LOGIN
===================================== */

function login(){

  const phone =
    document.getElementById("loginPhone").value.trim();

  const pin =
    document.getElementById("loginPin").value.trim();

  const saved =
    JSON.parse(
      localStorage.getItem("dujon_user") || "null"
    );

  if(
    saved &&
    saved.phone === phone &&
    saved.pin === pin
  ){

    localStorage.setItem(
      "dujon_logged",
      "yes"
    );

    showPage("homePage");

  }else{

    document.getElementById("loginMessage").innerText =
      "মোবাইল নাম্বার বা PIN ভুল";

  }

}


/* =====================================
   LOGOUT
===================================== */

function logout(){

  closeSocket();

  localStorage.removeItem("dujon_logged");

  showPage("loginPage");

}


/* =====================================
   SOCKET
===================================== */

function connectRoom(code){

  code =
    String(code || "").trim();

  if(!/^\d{6}$/.test(code)){
    return;
  }


  /* একই Room-এ একই socket থাকলে
     নতুন connection তৈরি করবো না */

  if(
    socket &&
    socket.readyState === WebSocket.OPEN &&
    currentRoom === code
  ){

    setConnectionStatus(
      "🟢 Room Connected"
    );

    return;
  }


  if(socket){
    try{
      socket.close();
    }catch(e){}
  }


  currentRoom = code;

  localStorage.setItem(
    "dujon_room",
    code
  );


  socket =
    new WebSocket(WS_URL);


  socket.onopen = () => {

    console.log(
      "WebSocket connected"
    );

    socket.send(
      JSON.stringify({
        type:"join",
        room:code
      })
    );

  };


  socket.onmessage = async event => {

    let data;

    try{
      data =
        JSON.parse(event.data);
    }catch(e){
      return;
    }

    console.log(
      "SERVER:",
      data
    );


    /* JOINED */

    if(data.type === "joined"){

      currentRoom =
        data.room;

      localStorage.setItem(
        "dujon_room",
        data.room
      );

      setConnectionStatus(
        "🟢 Room Connected"
      );

      return;
    }


    /* PEER JOINED */

    if(data.type === "peer-joined"){

      console.log(
        "Other phone joined"
      );

      return;
    }


    /* CHAT */

    if(data.type === "chat"){

      addMessage(
        data.message,
        false
      );

      return;
    }


    /* VIDEO CALL REQUEST */

    if(data.type === "video-call"){

      showIncomingCall();

      return;
    }


    /* OFFER */

    if(data.type === "video-offer"){

      pendingOffer =
        data.offer;

      console.log(
        "Offer received"
      );

      return;
    }


    /* ANSWER */

    if(data.type === "video-answer"){

      if(!peerConnection){
        return;
      }

      try{

        await peerConnection.setRemoteDescription(
          new RTCSessionDescription(
            data.answer
          )
        );

        console.log(
          "Answer received"
        );

      }catch(error){

        console.error(
          "Answer error:",
          error
        );

      }

      return;
    }


    /* ICE */

    if(data.type === "ice-candidate"){

      if(
        peerConnection &&
        data.candidate
      ){

        try{

          await peerConnection.addIceCandidate(
            new RTCIceCandidate(
              data.candidate
            )
          );

        }catch(error){

          console.error(
            "ICE error:",
            error
          );

        }

      }

      return;
    }


    /* CALL ENDED */

    if(data.type === "call-ended"){

      endCall(false);

      return;
    }


    /* CALL REJECTED */

    if(data.type === "call-rejected"){

      alert(
        "অন্য ফোন কলটি গ্রহণ করেনি।"
      );

      endCall(false);

      return;
    }


    /* ERROR */

    if(data.type === "error"){

      alert(data.message);

      return;
    }

  };


  socket.onerror = error => {

    console.error(
      "WebSocket error:",
      error
    );

    setConnectionStatus(
      "🔴 Connection Error"
    );

  };


  socket.onclose = () => {

    console.log(
      "WebSocket closed"
    );

    setConnectionStatus(
      "⚪ Disconnected"
    );

  };

}


/* =====================================
   STATUS
===================================== */

function setConnectionStatus(text){

  const el =
    document.getElementById(
      "connectionStatus"
    );

  if(el){
    el.innerText = text;
  }

}


/* =====================================
   CLOSE SOCKET
===================================== */

function closeSocket(){

  if(socket){

    try{
      socket.close();
    }catch(e){}

  }

  socket = null;
}


/* =====================================
   CREATE ROOM
===================================== */

function createRoom(){

  const code =
    String(
      Math.floor(
        100000 +
        Math.random() * 900000
      )
    );

  currentRoom = code;

  localStorage.setItem(
    "dujon_room",
    code
  );

  document.getElementById(
    "roomCodeBox"
  ).innerHTML =
    `<div class="room-code">${code}</div>
     <p style="text-align:center">
     এই Code অন্য ফোনে দিন
     </p>`;

  connectRoom(code);

}


/* =====================================
   JOIN ROOM
===================================== */

function joinRoom(){

  const code =
    document.getElementById(
      "joinCode"
    ).value.trim();

  if(!/^\d{6}$/.test(code)){

    alert(
      "৬ সংখ্যার Room Code দিন"
    );

    return;
  }

  connectRoom(code);

}


/* =====================================
   CHAT
===================================== */

function openChat(){

  if(!currentRoom){

    alert(
      "আগে একটি Room-এ ঢুকুন"
    );

    showPage("roomPage");

    return;
  }


  showPage("chatPage");


  if(
    !socket ||
    socket.readyState !== WebSocket.OPEN ||
    currentRoom !==
    localStorage.getItem("dujon_room")
  ){

    connectRoom(currentRoom);

  }

}


/* =====================================
   SEND MESSAGE
===================================== */

function sendMessage(){

  const input =
    document.getElementById(
      "messageInput"
    );

  const message =
    input.value.trim();

  if(!message){
    return;
  }


  if(
    !socket ||
    socket.readyState !==
    WebSocket.OPEN
  ){

    alert(
      "Room এখনো Connected নয়"
    );

    return;
  }


  socket.send(
    JSON.stringify({

      type:"chat",

      message:message

    })
  );


  addMessage(
    message,
    true
  );


  input.value = "";

}


/* =====================================
   ADD CHAT MESSAGE
===================================== */

function addMessage(
  message,
  mine
){

  const box =
    document.getElementById(
      "chatBox"
    );

  if(!box){
    return;
  }


  const div =
    document.createElement(
      "div"
    );

  div.className =
    "message" +
    (mine ? " me" : "");

  div.innerText =
    message;

  box.appendChild(div);

  box.scrollTop =
    box.scrollHeight;

}


/* =====================================
   VIDEO FROM HOME
===================================== */

function startVideoFromHome(){

  if(!currentRoom){

    alert(
      "আগে একটি Room-এ ঢুকুন"
    );

    showPage("roomPage");

    return;
  }

  makeCall();

}


/* =====================================
   CREATE PEER CONNECTION
===================================== */

function createPeerConnection(){

  if(peerConnection){

    try{
      peerConnection.close();
    }catch(e){}

  }


  peerConnection =
    new RTCPeerConnection(
      rtcConfig
    );


  /* Remote video */

  peerConnection.ontrack =
    event => {

      console.log(
        "Remote stream received"
      );

      const remoteVideo =
        document.getElementById(
          "remoteVideo"
        );

      if(
        event.streams &&
        event.streams[0]
      ){

        remoteVideo.srcObject =
          event.streams[0];

        remoteVideo.play()
          .catch(()=>{});

      }

    };


  /* ICE candidate */

  peerConnection.onicecandidate =
    event => {

      if(
        event.candidate &&
        socket &&
        socket.readyState ===
        WebSocket.OPEN
      ){

        socket.send(
          JSON.stringify({

            type:
              "ice-candidate",

            candidate:
              event.candidate

          })
        );

      }

    };


  peerConnection.onconnectionstatechange =
    () => {

      console.log(
        "Connection:",
        peerConnection.connectionState
      );

    };


  peerConnection.oniceconnectionstatechange =
    () => {

      console.log(
        "ICE:",
        peerConnection.iceConnectionState
      );

    };


  /* Local tracks */

  if(localStream){

    localStream
      .getTracks()
      .forEach(track => {

        peerConnection.addTrack(
          track,
          localStream
        );

      });

  }

}


/* =====================================
   GET CAMERA + MICROPHONE
===================================== */

async function getLocalMedia(){

  if(localStream){
    return localStream;
  }


  try{

    localStream =
      await navigator.mediaDevices.getUserMedia({

        video:{
          facingMode:"user"
        },

        audio:true

      });


    const localVideo =
      document.getElementById(
        "localVideo"
      );

    localVideo.srcObject =
      localStream;

    localVideo.play()
      .catch(()=>{});


    return localStream;

  }catch(error){

    console.error(
      "Camera/Mic error:",
      error
    );

    alert(
      "Camera ও Microphone Permission দিন।"
    );

    throw error;

  }

}


/* =====================================
   MAKE CALL
===================================== */

async function makeCall(){

  try{

    if(
      !socket ||
      socket.readyState !==
      WebSocket.OPEN
    ){

      alert(
        "Room Connected নয়"
      );

      return;
    }


    showPage("videoPage");


    await getLocalMedia();


    createPeerConnection();


    /* প্রথমে incoming call signal */

    socket.send(
      JSON.stringify({

        type:
          "video-call"

      })
    );


    /* Offer */

    const offer =
      await peerConnection.createOffer({

        offerToReceiveAudio:true,
        offerToReceiveVideo:true

      });


    await peerConnection.setLocalDescription(
      offer
    );


    socket.send(
      JSON.stringify({

        type:
          "video-offer",

        offer:
          peerConnection.localDescription

      })
    );


    console.log(
      "Video offer sent"
    );

  }catch(error){

    console.error(
      "Make call error:",
      error
    );

  }

}


/* =====================================
   INCOMING CALL
===================================== */

function showIncomingCall(){

  document.getElementById(
    "incomingCall"
  ).style.display =
    "flex";

}


/* =====================================
   ACCEPT CALL
===================================== */

async function acceptCall(){

  document.getElementById(
    "incomingCall"
  ).style.display =
    "none";


  try{

    showPage("videoPage");


    await getLocalMedia();


    createPeerConnection();


    if(!pendingOffer){

      console.log(
        "Offer not received yet"
      );

      return;

    }


    await peerConnection.setRemoteDescription(

      new RTCSessionDescription(
        pendingOffer
      )

    );


    const answer =
      await peerConnection.createAnswer();


    await peerConnection.setLocalDescription(
      answer
    );


    socket.send(
      JSON.stringify({

        type:
          "video-answer",

        answer:
          peerConnection.localDescription

      })
    );


    console.log(
      "Answer sent"
    );


    pendingOffer = null;

  }catch(error){

    console.error(
      "Accept call error:",
      error
    );

    alert(
      "ভিডিও কানেকশন তৈরি করা যায়নি।"
    );

  }

}


/* =====================================
   REJECT CALL
===================================== */

function rejectCall(){

  document.getElementById(
    "incomingCall"
  ).style.display =
    "none";


  if(
    socket &&
    socket.readyState ===
    WebSocket.OPEN
  ){

    socket.send(
      JSON.stringify({

        type:
          "call-rejected"

      })
    );

  }


  pendingOffer = null;

}


/* =====================================
   CAMERA
===================================== */

function toggleCamera(){

  if(!localStream){
    return;
  }


  const track =
    localStream.getVideoTracks()[0];

  if(track){

    track.enabled =
      !track.enabled;

  }

}


/* =====================================
   MICROPHONE
===================================== */

function toggleMic(){

  if(!localStream){
    return;
  }


  const track =
    localStream.getAudioTracks()[0];

  if(track){

    track.enabled =
      !track.enabled;

  }

}


/* =====================================
   END CALL
===================================== */

function endCall(sendSignal){

  if(
    sendSignal &&
    socket &&
    socket.readyState ===
    WebSocket.OPEN
  ){

    socket.send(
      JSON.stringify({

        type:
          "call-ended"

      })
    );

  }


  if(peerConnection){

    try{
      peerConnection.close();
    }catch(e){}

  }

  peerConnection = null;


  if(localStream){

    localStream
      .getTracks()
      .forEach(track =>
        track.stop()
      );

  }

  localStream = null;


  document.getElementById(
    "localVideo"
  ).srcObject = null;

  document.getElementById(
    "remoteVideo"
  ).srcObject = null;


  showPage("homePage");

}


/* =====================================
   AUTO LOGIN
===================================== */

window.addEventListener(
  "load",
  () => {

    if(
      localStorage.getItem(
        "dujon_logged"
      ) === "yes"
    ){

      showPage("homePage");

    }

  }
);

</script>
