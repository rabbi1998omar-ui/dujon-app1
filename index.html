<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090912">

<link rel="manifest" href="/manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">

<title>দুজন ❤️</title>

<style>
*{
 box-sizing:border-box;
 margin:0;
 padding:0;
 font-family:Arial,"Noto Sans Bengali",sans-serif
}

body{
 background:radial-gradient(circle at top,#351d48,#120d1d 45%,#07070c);
 color:#fff;
 min-height:100vh
}

.page{
 display:none;
 min-height:100vh;
 padding:20px
}

.page.active{
 display:block
}

.container{
 max-width:520px;
 margin:auto
}

.card{
 background:rgba(255,255,255,.08);
 border:1px solid rgba(255,255,255,.12);
 backdrop-filter:blur(18px);
 border-radius:24px;
 padding:20px;
 margin-bottom:16px
}

button,input,textarea{
 font:inherit
}

button{
 border:0;
 cursor:pointer
}

h1{font-size:29px}
h2{font-size:22px;margin-bottom:8px}
h3{margin-bottom:8px}

p{
 color:#ccc;
 line-height:1.5
}

.center{text-align:center}
.hidden{display:none!important}

input,textarea{
 width:100%;
 padding:15px;
 margin:8px 0;
 border-radius:15px;
 border:1px solid rgba(255,255,255,.12);
 outline:0;
 background:rgba(0,0,0,.25);
 color:#fff
}

textarea{
 resize:none;
 min-height:100px
}

input::placeholder,
textarea::placeholder{
 color:#aaa
}

.btn{
 width:100%;
 padding:15px;
 border-radius:15px;
 margin-top:8px;
 background:linear-gradient(135deg,#ff4f91,#814cff);
 color:#fff;
 font-weight:bold
}

.btn.secondary{
 background:rgba(255,255,255,.1)
}

.btn.danger{
 background:#b52d45
}

.small-btn{
 padding:9px 13px;
 border-radius:12px;
 background:rgba(255,255,255,.1);
 color:#fff
}

.home-header{
 display:flex;
 justify-content:space-between;
 align-items:center;
 margin-bottom:20px
}

.my-profile{
 display:flex;
 align-items:center;
 gap:12px
}

.avatar{
 width:54px;
 height:54px;
 border-radius:50%;
 background:linear-gradient(135deg,#ff4f91,#814cff);
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:24px;
 overflow:hidden;
 flex-shrink:0
}

.avatar img{
 width:100%;
 height:100%;
 object-fit:cover
}

.online-dot{
 display:inline-block;
 width:9px;
 height:9px;
 background:#34e27a;
 border-radius:50%;
 margin-right:5px
}

.hero{
 padding:30px 20px;
 text-align:center;
 background:linear-gradient(
  135deg,
  rgba(255,75,145,.22),
  rgba(117,70,255,.2)
 )
}

.hero .heart{
 font-size:50px;
 margin-bottom:8px
}

.partner{
 display:flex;
 align-items:center;
 gap:14px
}

.partner-info{
 flex:1
}

.partner-name{
 font-size:19px;
 font-weight:bold
}

.status{
 color:#aaa;
 font-size:13px;
 margin-top:4px
}

.quick-grid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:12px
}

.quick{
 position:relative;
 padding:19px 10px;
 border-radius:20px;
 background:rgba(255,255,255,.08);
 color:#fff;
 text-align:center
}

.quick-icon{
 font-size:29px;
 display:block;
 margin-bottom:7px
}

.badge{
 position:absolute;
 top:8px;
 right:10px;
 min-width:22px;
 height:22px;
 padding:0 6px;
 background:#ff315f;
 border-radius:20px;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:11px;
 font-weight:bold
}

.feeling-grid{
 display:grid;
 grid-template-columns:repeat(5,1fr);
 gap:7px;
 margin-top:12px
}

.feeling{
 padding:12px 4px;
 border-radius:15px;
 background:rgba(255,255,255,.08);
 color:#fff;
 font-size:22px
}

.room-code{
 font-size:34px;
 letter-spacing:7px;
 text-align:center;
 margin:20px 0
}

.connection{
 text-align:center;
 color:#aaa;
 font-size:13px
}

.chat-box{
 height:48vh;
 overflow-y:auto;
 padding:8px 2px
}

.message{
 max-width:78%;
 padding:12px 15px;
 border-radius:18px;
 margin:8px 0;
 word-wrap:break-word
}

.message.me{
 margin-left:auto;
 background:linear-gradient(135deg,#ff4f91,#814cff);
 border-bottom-right-radius:5px
}

.message.other{
 margin-right:auto;
