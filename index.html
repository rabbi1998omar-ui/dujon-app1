<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>দুজন ❤️</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#08080d;
  color:white;
  min-height:100vh;
}

.page{
  display:none;
  min-height:100vh;
  padding:25px;
}

.active{
  display:block;
}

.card{
  max-width:450px;
  margin:40px auto;
  background:#171722;
  padding:25px;
  border-radius:22px;
}

h1{
  text-align:center;
  margin-bottom:20px;
}

input{
  width:100%;
  padding:14px;
  margin:8px 0;
  border:0;
  border-radius:12px;
  font-size:16px;
}

button{
  border:0;
  border-radius:13px;
  padding:13px 18px;
  font-size:16px;
  cursor:pointer;
}

.main-btn{
  width:100%;
  margin-top:12px;
  background:#ff3b81;
  color:white;
}

.secondary{
  background:#292938;
  color:white;
}

.status{
  text-align:center;
  margin:15px 0;
  color:#8aff9b;
}

.room-code{
  text-align:center;
  font-size:35px;
  letter-spacing:7px;
  margin:25px 0;
  color:#ff5b98;
}

.chat-box{
  height:55vh;
  overflow-y:auto;
  background:#11111a;
  padding:15px;
  border-radius:15px;
}

.message{
  padding:10px 14px;
  margin:8px 0;
  border-radius:15px;
  max-width:80%;
  background:#292938;
}

.me{
  margin-left:auto;
  background:#ff3b81;
}

.chat-input{
  display:flex;
  gap:8px;
  margin-top:10px;
}

.chat-input input{
  margin:0;
}

.chat-input button{
  background:#ff3b81;
  color:white;
}


/* ================= VIDEO CALL ================= */

.video-page{
  padding:0;
  background:#000;
  position:relative;
}

.video-container{
  position:relative;
  width:100%;
  height:78vh;
  background:#111;
  overflow:hidden;
}

#remoteVideo{
  width:100%;
  height:100%;
  object-fit:cover;
  background:#111;
}

#localVideo{
  position:absolute;
  right:15px;
  top:15px;
  width:125px;
  height:175px;
  object-fit:cover;
  border-radius:16px;
  border:2px solid rgba(255,255,255,.8);
  background:#222;
  z-index:5;
}

.video-top{
  position:absolute;
  left:0;
  right:0;
  top:0;
  padding:18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  z-index:10;
  background:linear-gradient(
    rgba(0,0,0,.65),
    transparent
  );
}

.call-title{
  font-size:18px;
  font-weight:bold;
}

.call-time{
  font-size:14px;
  color:#ddd;
  margin-top:4px;
}

.connection{
  padding:7px 11px;
  border-radius:20px;
  background:rgba(0,0,0,.5);
  font-size:12px;
}

.video-bottom{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  padding:22px 15px 28px;
  z-index:10;
  background:linear-gradient(
    transparent,
    rgba(0,0,0,.9)
  );
}

.video-controls{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:14px;
}

.control{
  width:58px;
  height:58px;
  border-radius:50%;
  padding:0;
  background:#292938;
  color:white;
  font-size:22px;
}

.control.active{
  background:#ffffff;
  color:#111;
}

.end-call{
  width:68px;
  height:58px;
  border-radius:30px;
  background:#e53935;
  color:white;
  font-size:24px;
}

.control-label{
  text-align:center;
  margin-top:8px;
  font-size:11px;
  color:#ddd;
}

.control-wrap{
  text-align:center;
}


/* ================= INCOMING CALL ================= */

#incomingCall{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.95);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:9999;
}

.call-card{
  width:90%;
  max-width:360px;
  background:#191925;
  border-radius:25px;
  padding:32px;
  text-align:center;
}

.call-icon{
  font-size:65px;
  margin-bottom:15px;
}

.call-buttons{
  display:flex;
  gap:12px;
  margin-top:25px;
}

.call-buttons button{
  flex:1;
}

.accept{
  background:#19b95b;
  color:white;
}

.reject{
  background:#e53935;
  color:white;
}
</style>
</head>

<body>


<!-- LOGIN -->

<section id="loginPage" class="page active">
<div class="card">

<h1>দুজন ❤️</h1>

<input id="loginPhone"
       type="tel"
       placeholder="মোবাইল নাম্বার">

<input id="loginPin"
       type="password"
       placeholder="PIN">

<button class="main-btn"
        onclick="login()">
লগইন
</button>

<button class="main-btn secondary"
        onclick="showPage('registerPage')">
নতুন অ্যাকাউন্ট
</button>

<p id="loginMessage"
   style="text-align:center;margin-top:15px;">
</p>

</div>
</section>


<!-- REGISTER -->

<section id="registerPage" class="page">
<div class="card">

<h1>অ্যাকাউন্ট তৈরি ❤️</h1>

<input id="regPhone"
       type="tel"
       placeholder="মোবাইল নাম্বার">

<input id="regPin"
       type="password"
       placeholder="PIN">

<button class="main-btn"
        onclick="registerUser()">
অ্যাকাউন্ট তৈরি
</button>

<button class="main-btn secondary"
        onclick="showPage('loginPage')">
ফিরে যাও
</button>

<p id="regMessage"
   style="text-align:center;margin-top:15px;">
</p>

</div>
</section>


<!-- HOME -->

<section id="homePage" class="page">
<div class="card">

<h1>দুজন ❤️</h1>

<button class="main-btn"
        onclick="showPage('roomPage')">
🔐 Private Room
</button>

<button class="main-btn"
        onclick="openChat()">
💬 Chat
</button>

<button class="main-btn"
        onclick="startVideoFromHome()">
🎥 Video Call
</button>

<button class="main-btn secondary"
        onclick="logout()">
Logout
</button>

</div>
</section>


<!-- ROOM -->

<section id="roomPage" class="page">
<div class="card">

<h1>Private Room 🔐</h1>

<button class="main-btn"
        onclick="createRoom()">
নতুন Room তৈরি
</button>

<div id="roomCodeBox"></div>

<input id="joinCode"
       maxlength="6"
       inputmode="numeric"
       placeholder="৬ সংখ্যার Room Code">

<button class="main-btn"
        onclick="joinRoom()">
Room-এ ঢুকুন
</button>

<p id="connectionStatus"
   class="status">
⚪ Room Connected নয়
</p>

<button class="main-btn secondary"
        onclick="showPage('homePage')">
Home
</button>

</div>
</section>


<!-- CHAT -->

<section id="chatPage" class="page">
<div class="card">

<h1>💬 দুজন Chat</h1>

<div id="chatBox"
     class="chat-box">
</div>

<div class="chat-input">

<input id="messageInput"
       type="text"
       placeholder="মেসেজ লিখুন..."
       onkeydown="if(event.key==='Enter')sendMessage()">

<button onclick="sendMessage()">
Send
</button>

</div>

<button class="main-btn secondary"
        onclick="showPage('homePage')">
Home
</button>

</div>
</section>


<!-- VIDEO CALL -->

<section id="videoPage"
         class="page video-page">

<div class="video-container">

<video id="remoteVideo"
       autoplay
       playsinline>
</video>

<video id="localVideo"
       autoplay
       muted
       playsinline>
</video>


<div class="video-top">

<div>
<div class="call-title">
❤️ দুজন
</div>

<div id="callTimer"
     class="call-time">
00:00
</div>
</div>

<div id="connectionText"
     class="connection">
Connecting...
</div>

</div>


<div class="video-bottom">

<div class="video-controls">


<div class="control-wrap">

<button id="cameraButton"
        class="control active"
        onclick="toggleCamera()">
📷
</button>

<div id="cameraLabel"
     class="control-label">
Camera On
</div>

</div>


<div class="control-wrap">

<button id="micButton"
        class="control active"
        onclick="toggleMic()">
🎤
</button>

<div id="micLabel"
     class="control-label">
Mic On
</div>

</div>


<div class="control-wrap">

<button class="end-call"
        onclick="endCall(true)">
☎
</button>

<div class="control-label">
End
</div>

</div>


</div>

</div>

</div>

</section>


<!-- INCOMING CALL -->

<div id="incomingCall">

<div class="call-card">

<div class="call-icon">
📞
</div>

<h2>Incoming Video Call</h2>

<p style="margin-top:8px;color:#bbb;">
আপনার জন্য একটি ভিডিও কল এসেছে
</p>

<div class="call-buttons">

<button class="accept"
        onclick="acceptCall()">
গ্রহণ
</button>

<button class="reject"
        onclick="rejectCall()">
বাতিল
</button>

</div>

</div>

</div>


<script>

/* ================================
   SETTINGS
================================ */

const WS_URL =
"wss://dujon-app1.onrender.com";


let socket = null;

let currentRoom =
localStorage.getItem("dujon_room") || null;

let pendingOffer = null;

let peerConnection = null;

let localStream = null;

let callSeconds = 0;

let callTimerInterval = null;


/* ================================
   WEBRTC
================================ */

const rtcConfig = {

iceServers:[

{
urls:"stun:stun.l.google.com:19302"
},

{
urls:"stun:stun1.l.google.com:19302"
}

]

};


/* ================================
   PAGE
================================ */

function showPage(id){

document
.querySelectorAll(".page")
.forEach(p=>{
p.classList.remove("active");
});

const page =
document.getElementById(id);

if(page){
page.classList.add("active");
}

}


/* ================================
   REGISTER
================================ */

function registerUser(){

const phone =
document.getElementById("regPhone")
.value.trim();

const pin =
document.getElementById("regPin")
.value.trim();

if(!phone || !pin){

document.getElementById("regMessage")
.innerText =
"সব তথ্য দিন";

return;
}

localStorage.setItem(
"dujon_user",
JSON.stringify({
phone,
pin
})
);

document.getElementById("regMessage")
.innerText =
"অ্যাকাউন্ট তৈরি হয়েছে ❤️";

setTimeout(()=>{
showPage("loginPage");
},800);

}


/* ================================
   LOGIN
================================ */

function login(){

const phone =
document.getElementById("loginPhone")
.value.trim();

const pin =
document.getElementById("loginPin")
.value.trim();

const saved =
JSON.parse(
localStorage.getItem("dujon_user")
|| "null"
);

if(
saved &&
saved.phone===phone &&
saved.pin===pin
){

localStorage.setItem(
"dujon_logged",
"yes"
);

showPage("homePage");

}else{

document.getElementById("loginMessage")
.innerText =
"মোবাইল নাম্বার বা PIN ভুল";

}

}


/* ================================
   LOGOUT
================================ */

function logout(){

endCall(false);

closeSocket();

localStorage.removeItem(
"dujon_logged"
);

showPage("loginPage");

}


/* ================================
   SOCKET CONNECT
================================ */

function connectRoom(code){

code =
String(code || "").trim();

if(!/^\d{6}$/.test(code)){
return;
}


if(
socket &&
socket.readyState===WebSocket.OPEN &&
currentRoom===code
){

setConnectionStatus(
"🟢 Room Connected"
);

return;

}


if(socket){

try{
socket.close();
}catch(e){}

}


currentRoom=code;

localStorage.setItem(
"dujon_room",
code
);


socket =
new WebSocket(WS_URL);


socket.onopen=()=>{

socket.send(
JSON.stringify({
type:"join",
room:code
})
);

};


socket.onmessage=async event=>{

let data;

try{
data=JSON.parse(event.data);
}catch(e){
return;
}


/* JOIN */

if(data.type==="joined"){

currentRoom=data.room;

setConnectionStatus(
"🟢 Room Connected"
);

return;
}


/* PEER */

if(data.type==="peer-joined"){
return;
}


/* CHAT */

if(data.type==="chat"){

addMessage(
data.message,
false
);

return;
}


/* INCOMING CALL */

if(data.type==="video-call"){

showIncomingCall();

return;
}


/* OFFER */

if(data.type==="video-offer"){

pendingOffer=data.offer;

return;
}


/* ANSWER */

if(data.type==="video-answer"){

if(!peerConnection){
return;
}

try{

await peerConnection
.setRemoteDescription(
new RTCSessionDescription(
data.answer
)
);

}catch(error){

console.error(error);

}

return;
}


/* ICE */

if(data.type==="ice-candidate"){

if(
peerConnection &&
data.candidate
){

try{

await peerConnection
.addIceCandidate(
new RTCIceCandidate(
data.candidate
)
);

}catch(error){

console.error(error);

}

}

return;
}


/* CALL END */

if(data.type==="call-ended"){

endCall(false);

return;
}


/* CALL REJECT */

if(data.type==="call-rejected"){

endCall(false);

alert(
"অন্য ফোন কলটি বাতিল করেছে।"
);

return;
}


/* ERROR */

if(data.type==="error"){

alert(data.message);

}

};


socket.onerror=()=>{

setConnectionStatus(
"🔴 Connection Error"
);

};


socket.onclose=()=>{

setConnectionStatus(
"⚪ Disconnected"
);

};

}


/* ================================
   CLOSE SOCKET
================================ */

function closeSocket(){

if(socket){

try{
socket.close();
}catch(e){}

}

socket=null;

}


/* ================================
   ROOM
================================ */

function createRoom(){

const code =
String(
Math.floor(
100000+
Math.random()*900000
)
);

currentRoom=code;

localStorage.setItem(
"dujon_room",
code
);

document.getElementById(
"roomCodeBox"
).innerHTML=
`
<div class="room-code">
${code}
</div>

<p style="text-align:center">
এই Code অন্য ফোনে দিন
</p>
`;

connectRoom(code);

}


function joinRoom(){

const code =
document.getElementById(
"joinCode"
).value.trim();

if(!/^\d{6}$/.test(code)){

alert(
"৬ সংখ্যার Room Code দিন"
);

return;
}

connectRoom(code);

}


/* ================================
   STATUS
================================ */

function setConnectionStatus(text){

const el =
document.getElementById(
"connectionStatus"
);

if(el){
el.innerText=text;
}

}


/* ================================
   CHAT
================================ */

function openChat(){

if(!currentRoom){

alert(
"আগে Room-এ ঢুকুন"
);

showPage("roomPage");

return;
}

showPage("chatPage");


if(
!socket ||
socket.readyState!==WebSocket.OPEN
){

connectRoom(currentRoom);

}

}


function sendMessage(){

const input =
document.getElementById(
"messageInput"
);

const message =
input.value.trim();

if(!message){
return;
}


if(
!socket ||
socket.readyState!==WebSocket.OPEN
){

alert(
"Room Connected নয়"
);

return;
}


socket.send(
JSON.stringify({

type:"chat",

message:message

})
);


addMessage(
message,
true
);

input.value="";

}


function addMessage(
message,
mine
){

const box =
document.getElementById(
"chatBox"
);

const div =
document.createElement(
"div"
);

div.className=
"message"+
(mine?" me":"");

div.innerText=message;

box.appendChild(div);

box.scrollTop=
box.scrollHeight;

}


/* ================================
   VIDEO
================================ */

function startVideoFromHome(){

if(!currentRoom){

alert(
"আগে Room-এ ঢুকুন"
);

showPage("roomPage");

return;
}

makeCall();

}


/* ================================
   LOCAL MEDIA
================================ */

async function getLocalMedia(){

if(localStream){
return localStream;
}


localStream =
await navigator.mediaDevices
.getUserMedia({

video:{
facingMode:"user"
},

audio:true

});


document.getElementById(
"localVideo"
).srcObject=
localStream;

return localStream;

}


/* ================================
   PEER CONNECTION
================================ */

function createPeerConnection(){

if(peerConnection){

try{
peerConnection.close();
}catch(e){}

}


peerConnection =
new RTCPeerConnection(
rtcConfig
);


peerConnection.ontrack =
event=>{

if(
event.streams &&
event.streams[0]
){

const video =
document.getElementById(
"remoteVideo"
);

video.srcObject =
event.streams[0];

video.play()
.catch(()=>{});

}

};


peerConnection.onicecandidate =
event=>{

if(
event.candidate &&
socket &&
socket.readyState===
WebSocket.OPEN
){

socket.send(
JSON.stringify({

type:"ice-candidate",

candidate:event.candidate

})
);

}

};


peerConnection.onconnectionstatechange =
()=>{

const state =
peerConnection.connectionState;

const text =
document.getElementById(
"connectionText"
);

if(state==="connected"){

text.innerText =
"🟢 Connected";

}else if(
state==="connecting"
){

text.innerText =
"Connecting...";

}else if(
state==="disconnected" ||
state==="failed"
){

text.innerText =
"🔴 Disconnected";

}

};


if(localStream){

localStream
.getTracks()
.forEach(track=>{

peerConnection.addTrack(
track,
localStream
);

});

}

}


/* ================================
   START CALL
================================ */

async function makeCall(){

try{

showPage("videoPage");

await getLocalMedia();

createPeerConnection();


socket.send(
JSON.stringify({
type:"video-call"
})
);


const offer =
await peerConnection
.createOffer({

offerToReceiveAudio:true,
offerToReceiveVideo:true

});


await peerConnection
.setLocalDescription(
offer
);


socket.send(
JSON.stringify({

type:"video-offer",

offer:
peerConnection.localDescription

})
);


startCallTimer();

}catch(error){

console.error(error);

alert(
"Camera/Microphone চালু করা যায়নি।"
);

}

}


/* ================================
   INCOMING
================================ */

function showIncomingCall(){

document.getElementById(
"incomingCall"
).style.display="flex";

}


/* ================================
   ACCEPT
================================ */

async function acceptCall(){

document.getElementById(
"incomingCall"
).style.display="none";


try{

showPage("videoPage");

await getLocalMedia();

createPeerConnection();


if(!pendingOffer){
return;
}


await peerConnection
.setRemoteDescription(
new RTCSessionDescription(
pendingOffer
)
);


const answer =
await peerConnection
.createAnswer();


await peerConnection
.setLocalDescription(
answer
);


socket.send(
JSON.stringify({

type:"video-answer",

answer:
peerConnection.localDescription

})
);


pendingOffer=null;

startCallTimer();

}catch(error){

console.error(error);

alert(
"ভিডিও কানেকশন তৈরি করা যায়নি।"
);

}

}


/* ================================
   REJECT
================================ */

function rejectCall(){

document.getElementById(
"incomingCall"
).style.display="none";


if(
socket &&
socket.readyState===WebSocket.OPEN
){

socket.send(
JSON.stringify({
type:"call-rejected"
})
);

}

pendingOffer=null;

}


/* ================================
   CAMERA
================================ */

function toggleCamera(){

if(!localStream){
return;
}

const track =
localStream.getVideoTracks()[0];

if(!track){
return;
}


track.enabled =
!track.enabled;


const button =
document.getElementById(
"cameraButton"
);

const label =
document.getElementById(
"cameraLabel"
);


if(track.enabled){

button.classList.add("active");

button.innerText="📷";

label.innerText=
"Camera On";

}else{

button.classList.remove("active");

button.innerText="🚫";

label.innerText=
"Camera Off";

}

}


/* ================================
   MICROPHONE
================================ */

function toggleMic(){

if(!localStream){
return;
}

const track =
localStream.getAudioTracks()[0];

if(!track){
return;
}


track.enabled =
!track.enabled;


const button =
document.getElementById(
"micButton"
);

const label =
document.getElementById(
"micLabel"
);


if(track.enabled){

button.classList.add("active");

button.innerText="🎤";

label.innerText=
"Mic On";

}else{

button.classList.remove("active");

button.innerText="🔇";

label.innerText=
"Mic Off";

}

}


/* ================================
   CALL TIMER
================================ */

function startCallTimer(){

clearInterval(
callTimerInterval
);

callSeconds=0;

updateCallTimer();

callTimerInterval =
setInterval(()=>{

callSeconds++;

updateCallTimer();

},1000);

}


function updateCallTimer(){

const min =
String(
Math.floor(
callSeconds/60
)
).padStart(2,"0");

const sec =
String(
callSeconds%60
).padStart(2,"0");

const timer =
document.getElementById(
"callTimer"
);

if(timer){

timer.innerText =
min+":"+sec;

}

}


/* ================================
   END CALL
================================ */

function endCall(
sendSignal
){

if(
sendSignal &&
socket &&
socket.readyState===
WebSocket.OPEN
){

socket.send(
JSON.stringify({
type:"call-ended"
})
);

}


clearInterval(
callTimerInterval
);

callTimerInterval=null;

callSeconds=0;


if(peerConnection){

try{
peerConnection.close();
}catch(e){}

}

peerConnection=null;


if(localStream){

localStream
.getTracks()
.forEach(track=>{
track.stop();
});

}

localStream=null;


document.getElementById(
"localVideo"
).srcObject=null;

document.getElementById(
"remoteVideo"
).srcObject=null;


document.getElementById(
"connectionText"
).innerText=
"Connecting...";


document.getElementById(
"callTimer"
).innerText=
"00:00";


showPage("homePage");

}


/* ================================
   AUTO LOGIN
================================ */

window.addEventListener(
"load",
()=>{

if(
localStorage.getItem(
"dujon_logged"
)==="yes"
){

showPage("homePage");

}

});

</script>
