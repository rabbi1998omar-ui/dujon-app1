<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#0b0b12">
<title>দুজন ❤️</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  min-height:100vh;
  color:white;
  background:linear-gradient(135deg,#08080d,#25101d);
}

.page{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

.container{
  width:100%;
  max-width:420px;
  padding:20px;
  margin:auto;
}

.card{
  padding:30px 22px;
  border-radius:26px;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.12);
  box-shadow:0 20px 50px rgba(0,0,0,.45);
  backdrop-filter:blur(15px);
}

.logo{
  text-align:center;
  font-size:46px;
  margin-bottom:8px;
}

h1{
  text-align:center;
  font-size:30px;
  margin-bottom:8px;
}

.subtitle{
  text-align:center;
  color:#ccc;
  margin-bottom:25px;
}

input{
  width:100%;
  padding:15px;
  margin:7px 0;
  border:1px solid rgba(255,255,255,.12);
  outline:none;
  border-radius:14px;
  background:rgba(255,255,255,.08);
  color:white;
  font-size:16px;
}

input::placeholder{
  color:#aaa;
}

button{
  width:100%;
  padding:15px;
  margin-top:12px;
  border:0;
  border-radius:14px;
  background:linear-gradient(135deg,#ff416c,#ff4b2b);
  color:white;
  font-size:16px;
  font-weight:bold;
}

.link{
  text-align:center;
  color:#ff7895;
  margin-top:18px;
  cursor:pointer;
}

.hidden{
  display:none!important;
}

.home{
  padding-top:45px;
  padding-bottom:30px;
}

.welcome{
  text-align:center;
  margin-bottom:30px;
}

.welcome h2{
  font-size:28px;
  margin-bottom:8px;
}

.user{
  color:#aaa;
  font-size:14px;
}

.features{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.feature{
  padding:25px 10px;
  text-align:center;
  border-radius:20px;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.1);
}

.icon{
  font-size:35px;
  margin-bottom:10px;
}

.logout{
  background:#333;
  margin-top:25px;
}
</style>
</head>

<body>

<!-- LOGIN / REGISTER -->

<div id="authPage" class="page">

<div class="container">

<div class="card">

<div class="logo">❤️</div>

<h1 id="title">দুজন</h1>

<p class="subtitle" id="subtitle">
মোবাইল নম্বর দিয়ে প্রবেশ করো
</p>


<!-- LOGIN -->

<div id="loginBox">

<input
type="tel"
id="loginPhone"
placeholder="মোবাইল নম্বর"
>

<input
type="password"
id="loginPin"
placeholder="৪-৬ সংখ্যার PIN"
inputmode="numeric"
maxlength="6"
>

<button onclick="login()">
লগইন ❤️
</button>

<div
class="link"
onclick="showRegister()"
>
নতুন অ্যাকাউন্ট তৈরি করো
</div>

</div>


<!-- REGISTER -->

<div id="registerBox" class="hidden">

<input
type="tel"
id="registerPhone"
placeholder="মোবাইল নম্বর"
>

<input
type="password"
id="registerPin"
placeholder="৪-৬ সংখ্যার PIN"
inputmode="numeric"
maxlength="6"
>

<input
type="password"
id="confirmPin"
placeholder="PIN আবার লিখো"
inputmode="numeric"
maxlength="6"
>

<button onclick="register()">
অ্যাকাউন্ট তৈরি ❤️
</button>

<div
class="link"
onclick="showLogin()"
>
আগে থেকেই অ্যাকাউন্ট আছে? লগইন করো
</div>

</div>

</div>

</div>

</div>


<!-- HOME -->

<div id="homePage" class="hidden">

<div class="container home">

<div class="welcome">

<div class="logo">💞</div>

<h2>স্বাগতম দুজনে</h2>

<p
class="user"
id="userPhone"
></p>

</div>


<div class="features">

<div
class="feature"
onclick="comingSoon('চ্যাট')"
>
<div class="icon">💬</div>
<p>চ্যাট</p>
</div>


<div
class="feature"
onclick="comingSoon('ভিডিও কল')"
>
<div class="icon">📹</div>
<p>ভিডিও কল</p>
</div>


<div
class="feature"
onclick="comingSoon('অডিও কল')"
>
<div class="icon">📞</div>
<p>অডিও কল</p>
</div>


<div
class="feature"
onclick="comingSoon('প্রাইভেট রুম')"
>
<div class="icon">🔐</div>
<p>প্রাইভেট রুম</p>
</div>

</div>


<button
class="logout"
onclick="logout()"
>
লগআউট
</button>

</div>

</div>


<script>

/* =========================
   ACCOUNT CREATE
========================= */

function register(){

const phone =
document
.getElementById("registerPhone")
.value
.trim();

const pin =
document
.getElementById("registerPin")
.value;

const confirmPin =
document
.getElementById("confirmPin")
.value;


/* ফোন নম্বর */

if(!phone){

alert("মোবাইল নম্বর লিখো 📱");

return;

}


/* শুধু সংখ্যা */

const cleanPhone =
phone.replace(/\D/g,"");


if(cleanPhone.length < 10){

alert("সঠিক মোবাইল নম্বর লিখো।");

return;

}


/* PIN */

if(pin.length < 4 || pin.length > 6){

alert("PIN ৪ থেকে ৬ সংখ্যার হতে হবে।");

return;

}


if(!/^\d+$/.test(pin)){

alert("PIN শুধু সংখ্যা দিয়ে হতে হবে।");

return;

}


if(pin !== confirmPin){

alert("দুইটি PIN একই নয়।");

return;

}


/* পুরোনো অ্যাকাউন্ট */

const saved =
localStorage.getItem("dujon_user");


if(saved){

const user =
JSON.parse(saved);

if(user.phone === cleanPhone){

alert("এই নম্বর দিয়ে আগে থেকেই অ্যাকাউন্ট আছে।");

return;

}

}


/* নতুন অ্যাকাউন্ট */

const user = {

phone:cleanPhone,

pin:pin

};


localStorage.setItem(
"dujon_user",
JSON.stringify(user)
);

localStorage.setItem(
"dujon_logged_in",
"true"
);

localStorage.setItem(
"dujon_current_phone",
cleanPhone
);


alert("অ্যাকাউন্ট তৈরি হয়েছে ❤️");

showHome();

}


/* =========================
   LOGIN
========================= */

function login(){

const phone =
document
.getElementById("loginPhone")
.value
.trim()
.replace(/\D/g,"");

const pin =
document
.getElementById("loginPin")
.value;


const saved =
localStorage.getItem("dujon_user");


if(!saved){

alert("আগে একটি অ্যাকাউন্ট তৈরি করো।");

return;

}


const user =
JSON.parse(saved);


if(
user.phone === phone &&
user.pin === pin
){

localStorage.setItem(
"dujon_logged_in",
"true"
);

localStorage.setItem(
"dujon_current_phone",
phone
);

alert("লগইন সফল হয়েছে ❤️");

showHome();

}

else{

alert("মোবাইল নম্বর অথবা PIN সঠিক নয়।");

}

}


/* =========================
   REGISTER PAGE
========================= */

function showRegister(){

document
.getElementById("loginBox")
.classList.add("hidden");

document
.getElementById("registerBox")
.classList.remove("hidden");

document
.getElementById("title")
.innerText =
"নতুন অ্যাকাউন্ট ❤️";

document
.getElementById("subtitle")
.innerText =
"দুজনের যাত্রা এখান থেকেই শুরু";

}


/* =========================
   LOGIN PAGE
========================= */

function showLogin(){

document
.getElementById("registerBox")
.classList.add("hidden");

document
.getElementById("loginBox")
.classList.remove("hidden");

document
.getElementById("title")
.innerText =
"দুজন";

document
.getElementById("subtitle")
.innerText =
"মোবাইল নম্বর দিয়ে প্রবেশ করো";

}


/* =========================
   HOME
========================= */

function showHome(){

document
.getElementById("authPage")
.classList.add("hidden");

document
.getElementById("homePage")
.classList.remove("hidden");


const phone =
localStorage.getItem(
"dujon_current_phone"
);


document
.getElementById("userPhone")
.innerText =
"📱 " + phone;

}


/* =========================
   LOGOUT
========================= */

function logout(){

localStorage.removeItem(
"dujon_logged_in"
);

localStorage.removeItem(
"dujon_current_phone"
);

document
.getElementById("homePage")
.classList.add("hidden");

document
.getElementById("authPage")
.classList.remove("hidden");

showLogin();

}


/* =========================
   AUTO LOGIN
========================= */

window.onload=function(){

const loggedIn =
localStorage.getItem(
"dujon_logged_in"
);

if(loggedIn === "true"){

showHome();

}

};


/* =========================
   FUTURE FEATURES
========================= */

function comingSoon(feature){

alert(
feature +
" ফিচারটি আমরা পরের ধাপে তৈরি করবো ❤️"
);

}

</script>

</body>
</html>
