<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dujon ❤️</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #16001f, #5b073b, #120014);
      color: white;
    }

    .box {
      width: 90%;
      max-width: 400px;
      padding: 35px 25px;
      text-align: center;
      border-radius: 25px;
      background: rgba(255,255,255,0.10);
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    }

    .heart {
      font-size: 65px;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 38px;
      margin-bottom: 10px;
    }

    p {
      color: #ffd9ed;
      margin-bottom: 25px;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 30px;
      background: #ff3f81;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.97);
    }
  </style>
</head>

<body>

  <div class="box">
    <div class="heart">❤️</div>

    <h1>Dujon</h1>

    <p>দুজন মানুষের জন্য, একটুখানি ভালোবাসার জায়গা।</p>

    <button onclick="startApp()">
      শুরু করি ❤️
    </button>
  </div>

  <script>
    function startApp() {
      alert("Dujon-এ স্বাগতম ❤️");
    }
  </script>

</body>
</html>
